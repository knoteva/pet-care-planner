name: Database Backup

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  backup:
    name: Neon Postgres backup
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Ensure DATABASE_URL secret exists
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL GitHub secret is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Create database dump with Postgres 17 client
        run: |
          mkdir -p backups
          BACKUP_NAME="pet-care-planner-$(date -u +%Y%m%d-%H%M%S).dump"
          docker run --rm \
            -e DATABASE_URL \
            -e BACKUP_NAME="$BACKUP_NAME" \
            -v "$PWD/backups:/backups" \
            postgres:17-alpine \
            sh -c 'pg_dump "$DATABASE_URL" --format=custom --no-owner --no-acl --file "/backups/$BACKUP_NAME"'
          echo "BACKUP_FILE=backups/$BACKUP_NAME" >> "$GITHUB_ENV"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: pet-care-planner-db-backup
          path: ${{ env.BACKUP_FILE }}
          retention-days: 14
