name: Database Backup

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

jobs:
  backup:
    name: Neon Postgres backup
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}

    steps:
      - name: Ensure DATABASE_URL secret exists
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "DATABASE_URL GitHub secret is missing. Add it in Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Create database dump
        run: |
          mkdir -p backups
          BACKUP_FILE="backups/pet-care-planner-$(date -u +%Y%m%d-%H%M%S).dump"
          pg_dump "$DATABASE_URL" --format=custom --no-owner --no-acl --file "$BACKUP_FILE"
          echo "BACKUP_FILE=$BACKUP_FILE" >> "$GITHUB_ENV"

      - name: Upload backup artifact
        uses: actions/upload-artifact@v4
        with:
          name: pet-care-planner-db-backup
          path: ${{ env.BACKUP_FILE }}
          retention-days: 14